<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>예람달력</title>
<style>body{font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;max-width:720px;margin:0 auto;padding:40px 20px;line-height:1.75;color:#1d2330}
header{display:flex;gap:16px;align-items:center}header img{width:64px;height:64px}h1{font-size:28px;margin:0}
a.btn{display:inline-block;margin:18px 0;padding:12px 22px;border-radius:10px;background:#2f5bd3;color:#fff;text-decoration:none;font-weight:700}
li{margin:4px 0}small{color:#667}</style></head>
<body>
<header><img src="icon.png" alt=""><div><h1>예람달력</h1><div>구글 캘린더와 연동되는 윈도우 바탕화면 달력</div></div></header>
<a class="btn" id="dl" href="../../releases/latest">설치 파일 받기</a>
<ul>
<li>구글 캘린더 일정을 월간 달력으로 보고, 바로 추가·수정·삭제</li>
<li>유리(글래스)·입체·평면 디자인, 배경·글꼴·크기 설정</li>
<li>오늘 일정만 보는 작은 창, 마우스를 올리면 그날 일정 크게 보기</li>
<li>광고 없음, 일정은 내 컴퓨터와 구글 사이에서만 오감</li>
</ul>
<p><a href="privacy.html">개인정보처리방침</a></p>
<small>만든 사람: 김예람 (부천북초등학교)</small>
<script>
// GitHub Pages 주소(아이디.github.io/저장소)에서 릴리스 페이지로 연결
(function(){var m=location.hostname.match(/^([^.]+)\.github\.io$/);var r=location.pathname.split('/')[1];
if(m&&r){document.getElementById('dl').href='https://github.com/'+m[1]+'/'+r+'/releases/latest';}})();
</script>
</body></html>
