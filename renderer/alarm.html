<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Ram Calendar 알림</title>
<style>
  :root { --bg: rgba(250,251,254,.97); --fg: #1b1f2a; --muted: #5f687c; --line: rgba(0,0,0,.08); --btn: #eef1f7; --btnh: #e2e7f1; --acc: #3b5bdb; --sh: rgba(20,30,60,.28) }
  :root.dark { --bg: rgba(36,39,48,.97); --fg: #f1f3f8; --muted: #a9b0c2; --line: rgba(255,255,255,.08); --btn: #343846; --btnh: #3e4352; --acc: #8ea6ff; --sh: rgba(0,0,0,.5) }
  * { box-sizing: border-box }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: "Malgun Gothic", "Segoe UI", sans-serif; user-select: none }
  .card { position: absolute; inset: 6px; border-radius: 12px; background: var(--bg); color: var(--fg); border: 1px solid var(--line);
    box-shadow: 0 8px 24px var(--sh); display: flex; flex-direction: column; padding: 10px 12px 10px 14px; animation: in .28s cubic-bezier(.2,.9,.3,1.2) both; cursor: default }
  .card.out { animation: out .2s ease-in both }
  @keyframes in { from { transform: translateX(110%); opacity: .4 } to { transform: none; opacity: 1 } }
  @keyframes out { to { transform: translateX(110%); opacity: 0 } }
  .head { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--muted) }
  .head img { width: 16px; height: 16px }
  .head .x { margin-left: auto; border: 0; background: none; color: var(--muted); font-size: 15px; width: 22px; height: 22px; border-radius: 6px; cursor: pointer }
  .head .x:hover { background: var(--btn) }
  .body { display: flex; gap: 10px; margin-top: 6px; flex: 1; min-height: 0; cursor: pointer }
  .bar { width: 4px; border-radius: 3px; background: var(--c, var(--acc)); flex: none }
  .txt { min-width: 0; flex: 1 }
  .title { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.35 }
  .when { font-size: 12.5px; color: var(--fg); margin-top: 2px }
  .when b { color: var(--acc); font-weight: 700 }
  .loc { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px }
  .btns { display: flex; gap: 6px; margin-top: 8px }
  .btns button { flex: 1; border: 0; border-radius: 7px; padding: 6px 0; font: inherit; font-size: 12.5px; background: var(--btn); color: var(--fg); cursor: pointer }
  .btns button:hover { background: var(--btnh) }
  .btns button.pri { background: var(--acc); color: #fff }
  .btns button.pri:hover { filter: brightness(1.08) }
  select { border: 0; border-radius: 7px; background: var(--btn); color: var(--fg); font: inherit; font-size: 12.5px; padding: 0 4px; cursor: pointer }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="head"><img src="../assets/icon.png" alt=""><span>Ram Calendar</span><span id="ago"></span><button class="x" id="x" title="닫기">✕</button></div>
  <div class="body" id="open" title="달력에서 보기">
    <div class="bar" id="bar"></div>
    <div class="txt">
      <div class="title" id="t"></div>
      <div class="when" id="w"></div>
      <div class="loc" id="l"></div>
    </div>
  </div>
  <div class="btns">
    <select id="snz" title="다시 알림 시간"><option value="5">5분</option><option value="10">10분</option><option value="15">15분</option></select>
    <button id="snooze">뒤에 다시</button>
    <button class="pri" id="ok">확인</button>
  </div>
</div>
<script>
  const D = JSON.parse(new URLSearchParams(location.search).get('d') || '{}');
  if (D.dark) document.documentElement.classList.add('dark');
  const $ = (id) => document.getElementById(id);
  $('t').textContent = D.title || '(제목 없음)';
  $('l').textContent = D.location ? '📍 ' + D.location : (D.calName || '');
  if (D.color) $('bar').style.setProperty('--c', D.color);
  const start = D.start, pad = (n) => String(n).padStart(2, '0');
  const hm = (t) => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
  function when() {
    const m = Math.round((start - Date.now()) / 60000);
    let s = m > 0 ? (m >= 60 ? Math.floor(m / 60) + '시간 ' + (m % 60 ? (m % 60) + '분 ' : '') : m + '분 ') + '후 시작' : m === 0 ? '지금 시작' : (-m) + '분 전에 시작함';
    $('w').innerHTML = hm(start) + (D.end ? '–' + hm(D.end) : '') + ' · <b>' + s + '</b>';
  }
  when(); setInterval(when, 15000);
  const act = (a, v) => { $('card').classList.add('out'); setTimeout(() => window.api && window.api.alarmAct(D.key, a, v), 180); };
  $('ok').onclick = () => act('ok');
  $('x').onclick = () => act('ok');
  $('snooze').onclick = () => act('snooze', +$('snz').value);
  $('open').onclick = () => act('open');
  // 부드러운 두 음 알림 소리 (파일 없이 소리 합성)
  if (D.sound) {
    try {
      const ac = new AudioContext(), now = ac.currentTime;
      [[880, 0], [1318.5, 0.16], [1046.5, 0.32]].forEach(([f, t]) => {
        const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0, now + t); g.gain.linearRampToValueAtTime(0.18, now + t + 0.02); g.gain.exponentialRampToValueAtTime(0.0008, now + t + 0.9);
        o.connect(g).connect(ac.destination); o.start(now + t); o.stop(now + t + 1);
      });
    } catch (e) {}
  }
</script>
</body>
</html>
